# ============================================================
#  autocut の設定ファイル
#  数字を書きかえて保存し、もう一度コマンドを実行すると反映されます。
#  「#」から右側は説明文（メモ）なので、動作には影響しません。
# ============================================================

[silence]
# 無音とみなす音の大きさ（dB）。
#   数字を 0 に近づける（例: -30）→ 小さな音も「無音」扱いになり、たくさんカットされる
#   数字を小さくする    （例: -45）→ 本当に静かな部分だけカットされる
# 実行すると「この動画の音量」が表示されるので、それを目安に調整してください。
threshold_db = -35

# この秒数より長く続いた無音だけをカットします。
#   小さくする（例: 0.4）→ テンポが速くなる / 大きくする（例: 1.0）→ ゆったり残る
min_silence = 0.6

# 残す余白（秒）。カットのつなぎ目が不自然にならないように、少しだけ無音を残します。
pad_before = 0.15   # 話し始める「前」に残す長さ
pad_after = 0.25    # 話し終わった「後」に残す長さ


[youtube]
# YouTube 用（16:9 横）の書き出しサイズ
width = 1920
height = 1080

# 1秒あたりのコマ数。"source" にすると元の動画と同じになります（30 や 60 と数字でも指定可）
fps = "source"


[encode]
# 書き出し方式
#   "auto"         … Macの高速な書き出し機能が使えれば使う（おすすめ）
#   "videotoolbox" … Macの高速書き出し（速い）
#   "x264"         … 時間はかかるが、同じ容量ならより高画質
encoder = "auto"

video_bitrate = "12M"    # 画質（videotoolbox のとき）。大きいほど高画質・大容量
crf = 18                 # 画質（x264 のとき）。小さいほど高画質。18〜23 が目安
audio_bitrate = "192k"   # 音質


# ============================================================
#  ここから下は、切り抜き機能（clip.py）の設定です
# ============================================================

[transcribe]
# 文字起こしに使うモデル
#   "auto"           … Macに合わせて自動で選ぶ（Apple Silicon: large-v3-turbo / Intel: small）
#   "large-v3-turbo" … 高精度（約1.6GB）。Apple Silicon 向け
#   "medium"         … 中くらい（約1.5GB）。Intel Mac で精度を上げたいとき（時間はかかります）
#   "small"          … 軽くて速い（約0.5GB）
model = "auto"
language = "ja"


[clips]
# 1本の動画から出す候補の本数
count_min = 5
count_max = 15

# 1本の長さ（秒）
length_min = 30
length_max = 60

# 候補を選ぶAI
#   "claude-opus-5-5"   … おすすめ。60分の動画で 50〜100円くらい
#   "claude-sonnet-5-5" … 料金は約半分。選び方の質は少し下がることがあります
model = "claude-opus-5-5"

# チャンネルの説明（書いておくと、AIが視聴者に合わせて選びます。空でもOK）
#   例: "ダンサー兼トラックメイカーの音楽制作記録。見ているのは曲作りを始めたい人。"
channel_info = ""
