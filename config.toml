# ============================================================
#  autocut の設定ファイル
#  数字を書きかえて保存し、もう一度コマンドを実行すると反映されます。
#  「#」から右側は説明文（メモ）なので、動作には影響しません。
# ============================================================

[silence]
# 無音とみなす音の大きさ（dB）。
#   数字を 0 に近づける（例: -30）→ 小さな音も「無音」扱いになり、たくさんカットされる
#   数字を小さくする    （例: -45）→ 本当に静かな部分だけカットされる
# 実行すると「この動画の音量」が表示されるので、それを目安に調整してください。
threshold_db = -35

# この秒数より長く続いた無音だけをカットします。
#   小さくする（例: 0.4）→ テンポが速くなる / 大きくする（例: 1.0）→ ゆったり残る
min_silence = 0.6

# 残す余白（秒）。カットのつなぎ目が不自然にならないように、少しだけ無音を残します。
pad_before = 0.15   # 話し始める「前」に残す長さ
pad_after = 0.25    # 話し終わった「後」に残す長さ


[youtube]
# YouTube 用（16:9 横）の書き出しサイズ
width = 1920
height = 1080

# 1秒あたりのコマ数。"source" にすると元の動画と同じになります（30 や 60 と数字でも指定可）
fps = "source"

# 字幕を動画に焼き込むか（true: 焼き込む / false: .srt だけ作る。YouTube に .srt をアップロードして字幕にする場合）
# 字幕の大きさ・色・位置は、下のほうの [subtitle] で変えられます
burn_subtitles = true


[encode]
# 書き出し方式
#   "auto"         … Macの高速な書き出し機能が使えれば使う（おすすめ）
#   "videotoolbox" … Macの高速書き出し（速い）
#   "x264"         … 時間はかかるが、同じ容量ならより高画質
encoder = "auto"

video_bitrate = "12M"    # 画質（videotoolbox のとき）。大きいほど高画質・大容量
crf = 18                 # 画質（x264 のとき）。小さいほど高画質。18〜23 が目安
audio_bitrate = "192k"   # 音質


# ============================================================
#  ここから下は、切り抜き機能（clip.py）の設定です
# ============================================================

[transcribe]
# 文字起こしに使うモデル
#   "auto"           … Macに合わせて自動で選ぶ（Apple Silicon: large-v3-turbo / Intel: small）
#   "large-v3-turbo" … 高精度（約1.6GB）。Apple Silicon 向け
#   "medium"         … 中くらい（約1.5GB）。Intel Mac で精度を上げたいとき（時間はかかります）
#   "small"          … 軽くて速い（約0.5GB）
model = "auto"
language = "ja"


[clips]
# 1本の動画から出す候補の本数
count_min = 5
count_max = 15

# 1本の長さ（秒）
length_min = 30
length_max = 60

# 候補を選ぶAI
#   "claude-opus-5-5"   … おすすめ。60分の動画で 50〜100円くらい
#   "claude-sonnet-5-5" … 料金は約半分。選び方の質は少し下がることがあります
model = "claude-opus-5-5"

# 書き出す形（コマンドで --export のあとに何も書かなかったときに使われます）
#   "tate"   … 縦 9:16（ショート / TikTok / リール）
#   "yoko"   … 横 16:9（YouTube）
#   "square" … 正方形 1:1 / "feed" … 4:5（Instagram フィード）
#   両方作るときは "tate yoko" のように空白で区切って並べる
shape = "tate"

# チャンネルの説明（書いておくと、AIが視聴者に合わせて選びます。空でもOK）
#   例: "ダンサー兼トラックメイカーの音楽制作記録。見ているのは曲作りを始めたい人。"
channel_info = ""


# ============================================================
#  テロップと字幕（clip.py で書き出すとき）
#  色は "#RRGGBB"（例: 白 "#FFFFFF" / 黒 "#000000" / 黄 "#FFE600"）。
#  後ろに2桁足すと透明度になります（"#00000099" = 半透明の黒）。
#  大きさは、縦・横どちらも「短い辺が1080ピクセル」のときの大きさです。
# ============================================================

[title]
# 最初に大きく出すタイトル（文字は候補の一覧の「タイトル案」。一覧で書きかえられます）
enabled = true
seconds = 2.0          # 出しておく秒数。最後までずっと出すなら 999
size = 96              # 文字の大きさ
color = "#FFE600"      # 文字の色
outline = "#000000"    # ふちの色
outline_width = 10     # ふちの太さ
band = ""              # 文字の後ろの帯の色（空なら帯なし。例: "#000000AA"）
position_tate = 20     # 縦の位置（上から何%）。縦・4:5 の動画
position_yoko = 14     # 縦の位置（上から何%）。横・正方形の動画
font = ""              # 空ならヒラギノ角ゴシック（太）。ほかのフォントは場所を書く（例: "/Library/Fonts/xxx.otf"）

[subtitle]
# 字幕（喋りの文字起こしから作ります）
enabled = true
size = 64
color = "#FFFFFF"
outline = "#000000"
outline_width = 7
band = ""
max_chars = 24         # 1つの字幕に入れる最大の文字数（2行まで）
position_tate = 72     # 縦の動画は、アプリのボタンや説明文に隠れないよう少し上に
position_yoko = 88
font = ""


# ============================================================
#  ダンス・ライブの見せ場探し（clip.py ... --dance）
# ============================================================

[dance]
count_min = 5          # 出す本数
count_max = 12
length_min = 20        # 1本の長さ（秒）。盛り上がりが続けば length_max まで伸ばします
length_max = 45

# 何を重視して「盛り上がり」とみなすか（大きいほど重視。0 にすると使わない）
weight_loud = 1.0      # 音の大きさ
weight_beat = 1.0      # ビートの強さ（音の立ち上がり）
weight_motion = 1.0    # 映像の動きの大きさ


[crop]
# 縦や正方形に切り出すとき、人物が左右に大きく動いたら、カメラを追いかけるように切り出す位置を動かす
follow = true


# ============================================================
#  言い間違い・「えー」「あの」のカット（autocut.py）
#  文字起こしをして、言葉を見てカットします。いらないときは words = false
#  （コマンドの最後に --quick を足しても、その回だけ無音カットだけになります）
# ============================================================

[cut]
words = true
fillers_enabled = true     # 「えー」「あの」などをカットする
repeats_enabled = true     # 同じ言葉をすぐ繰り返したとき（「これは、これは」）、1回目をカットする
restarts_enabled = true    # 言いかけてやめて言い直したとき、言いかけた方をカットする

# カットする「えー」「あの」の言葉。語尾が伸びた形（えーー、あのー）も含みます。
# 前後に「、」や間（ま）があるときだけカットするので、「あの人」の「あの」は残ります。
fillers = ["えー", "えーと", "えっと", "えーっと", "あー", "あのー", "あの", "そのー", "うーん", "んー", "まあ", "なんか"]

# 文字起こしの AI は「えー」などを省いて書きがちなので、書き残すようにお願いする文
prompt = "えー、あの、えっと、まあ、そのー、うーん、なんか。"

# BGM が流れていて音量では無音が分からないときも、喋っていない間をカットする
speech_gaps = true
speech_gap_min = 1.0         # この秒数より長く喋っていない間をカット
speech_gap_pad_before = 0.25 # 話し始める前に残す余白
speech_gap_pad_after = 0.35  # 話し終わった後に残す余白
word_pad = 0.02              # 「えー」などを切るときに、前後に足す余白（秒）
