# ============================================================
#  autocut の設定ファイル
#  数字を書きかえて保存し、もう一度コマンドを実行すると反映されます。
#  「#」から右側は説明文（メモ）なので、動作には影響しません。
# ============================================================

[silence]
# 無音とみなす音の大きさ（dB）。
#   数字を 0 に近づける（例: -30）→ 小さな音も「無音」扱いになり、たくさんカットされる
#   数字を小さくする    （例: -45）→ 本当に静かな部分だけカットされる
# 実行すると「この動画の音量」が表示されるので、それを目安に調整してください。
threshold_db = -35

# この秒数より長く続いた無音だけをカットします。
#   小さくする（例: 0.4）→ テンポが速くなる / 大きくする（例: 1.0）→ ゆったり残る
min_silence = 0.6

# 残す余白（秒）。カットのつなぎ目が不自然にならないように、少しだけ無音を残します。
pad_before = 0.15   # 話し始める「前」に残す長さ
pad_after = 0.25    # 話し終わった「後」に残す長さ


[youtube]
# YouTube 用（16:9 横）の書き出しサイズ
width = 1920
height = 1080

# 1秒あたりのコマ数。"source" にすると元の動画と同じになります（30 や 60 と数字でも指定可）
fps = "source"


[encode]
# 書き出し方式
#   "auto"         … Macの高速な書き出し機能が使えれば使う（おすすめ）
#   "videotoolbox" … Macの高速書き出し（速い）
#   "x264"         … 時間はかかるが、同じ容量ならより高画質
encoder = "auto"

video_bitrate = "12M"    # 画質（videotoolbox のとき）。大きいほど高画質・大容量
crf = 18                 # 画質（x264 のとき）。小さいほど高画質。18〜23 が目安
audio_bitrate = "192k"   # 音質
